<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws://localhost:*; object-src 'none'; base-uri 'self';" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Planner</title>
    <script>
      // Automatically refresh the application if a new version is deployed and a module load fails
      window.addEventListener('vite:preloadError', (event) => {
        console.warn('New deployment detected (preload error). Refreshing...');
        window.location.reload();
      });
      window.addEventListener('error', (err) => {
        if (err.message && (err.message.includes('Failed to fetch dynamically imported module') || err.message.includes('Importing a module script failed'))) {
          console.warn('Dynamic import failed, likely due to a new deployment. Refreshing...');
          window.location.reload();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
